    <dialog class="art-lightbox" id="artLightbox" aria-label="Artwork preview">
        <button class="art-lightbox-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                <line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
        </button>
        <div class="art-lightbox-content"></div>
    </dialog>

    <script>
        (function () {
            var lightbox = document.getElementById('artLightbox');
            var closeBtn = lightbox.querySelector('.art-lightbox-close');
            var contentEl = lightbox.querySelector('.art-lightbox-content');
            var tiles = document.querySelectorAll('.art-tile');
            var openerTile = null;

            // Native <dialog> + showModal() handles focus trapping, making
            // the rest of the page inert to assistive tech while open, and
            // closing on Escape — no hand-rolled logic needed for any of
            // that. We only add: building the content, an open animation,
            // closing on backdrop click, and restoring focus on close.

            function openLightbox(tile) {
                var img = tile.querySelector('img');
                var caption = tile.getAttribute('data-caption') || '';
                contentEl.innerHTML = '';

                if (img) {
                    var full = document.createElement('img');
                    full.src = tile.getAttribute('data-full') || img.src;
                    full.alt = img.alt || caption;
                    contentEl.appendChild(full);
                    if (caption) {
                        var description = document.createElement('p');
                        description.className = 'art-lightbox-caption';
                        description.textContent = caption;
                        contentEl.appendChild(description);
                    }
                } else {
                    var placeholder = document.createElement('div');
                    placeholder.className = 'art-lightbox-placeholder';
                    var span = document.createElement('span');
                    span.textContent = caption || 'Add image';
                    placeholder.appendChild(span);
                    contentEl.appendChild(placeholder);
                }

                openerTile = tile;
                lightbox.showModal();
                document.body.classList.add('art-scroll-lock');
                requestAnimationFrame(function () {
                    lightbox.classList.add('art-lightbox--open');
                });
            }

            tiles.forEach(function (tile) {
                tile.addEventListener('click', function () { openLightbox(tile); });
            });

            closeBtn.addEventListener('click', function () {
                lightbox.close();
            });

            // Click on the backdrop (the dialog element itself, outside the
            // content box) closes it; clicks inside the content box don't.
            lightbox.addEventListener('click', function (event) {
                if (event.target === lightbox) lightbox.close();
            });

            // Fires on Escape (native) and on any programmatic close() call.
            lightbox.addEventListener('close', function () {
                lightbox.classList.remove('art-lightbox--open');
                document.body.classList.remove('art-scroll-lock');
                if (openerTile) {
                    openerTile.focus();
                    openerTile = null;
                }
            });
        })();
    </script>
